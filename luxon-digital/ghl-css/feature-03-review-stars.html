<!-- Luxon graphic | Review Automation: five stars filling in with a sample review | paste into ONE Custom Code element -->
<div class="lxg3">
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&display=swap');
.lxg3,.lxg3 *,.lxg3 *::before,.lxg3 *::after{box-sizing:border-box !important}
.lxg3{width:100% !important;max-width:560px !important;margin:0 auto !important;font-family:'Inter',sans-serif !important}
.lxg3 p{margin:0 !important}
.lxg3 .mini{border-radius:18px !important;padding:22px !important;background:linear-gradient(150deg,#0E2B5E,#0B1F3A 60%,#071528) !important;color:#FFFFFF !important;font-size:14px !important;box-shadow:0 20px 50px rgba(11,31,58,.18) !important}
.lxg3 .mini{text-align:center !important}
.lxg3 .stars{display:flex !important;gap:6px !important;justify-content:center !important}
.lxg3 .stars svg{opacity:.2;animation:lxg3Star 6s ease infinite}
.lxg3 .stars svg:nth-child(2){animation-delay:.2s}
.lxg3 .stars svg:nth-child(3){animation-delay:.4s}
.lxg3 .stars svg:nth-child(4){animation-delay:.6s}
.lxg3 .stars svg:nth-child(5){animation-delay:.8s}
.lxg3 .quote{margin-top:12px !important;font-size:14.5px !important;color:rgba(255,255,255,.85) !important}
@keyframes lxg3Star{0%,8%{opacity:.2;transform:scale(.8)}15%,85%{opacity:1;transform:scale(1)}100%{opacity:.2;transform:scale(.8)}}
@media (prefers-reduced-motion:reduce){.lxg3 *,.lxg3 *::before,.lxg3 *::after{animation:none !important}.lxg3 .tl-i,.lxg3 .stars svg{opacity:1 !important;transform:none !important}}
</style>
