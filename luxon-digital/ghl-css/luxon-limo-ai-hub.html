<!-- Luxon Limo AI hub graphic: paste into ONE Custom Code element (full width, under the hero buttons).
     Transparent background, so it sits on the hero section gradient. -->

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@500;600&display=swap');
.lxhub,.lxhub *,.lxhub *::before,.lxhub *::after{box-sizing:border-box !important}
.lxhub{width:100% !important;max-width:1200px !important;margin:0 auto !important;font-family:'Inter',sans-serif !important}
.lxhub .flow{display:grid !important;grid-template-columns:1fr auto 1fr !important;gap:28px !important;align-items:center !important;text-align:left !important}
.lxhub .flow-col{display:flex !important;flex-direction:column !important;gap:12px !important;min-width:0 !important}
.lxhub .flow-t{font-family:'Montserrat',sans-serif !important;font-weight:700 !important;font-size:12.5px !important;letter-spacing:.16em !important;color:#F5DC85 !important;margin:0 0 4px !important}
.lxhub .flow-i{position:relative !important;overflow:hidden !important;display:flex !important;align-items:center !important;gap:12px !important;padding:14px 16px !important;border-radius:14px !important;background:rgba(255,255,255,.07) !important;border:1px solid rgba(255,255,255,.14) !important;font-weight:600 !important;font-size:15px !important;line-height:1.35 !important;color:#FFFFFF !important;margin:0 !important;transition:transform .25s ease,border-color .25s ease,background .25s ease !important}
.lxhub .flow-i:hover{transform:translateY(-2px) !important;border-color:rgba(212,175,55,.45) !important;background:rgba(255,255,255,.1) !important}
.lxhub .flow-i::after{content:'' !important;position:absolute !important;top:0 !important;bottom:0 !important;left:0 !important;width:40% !important;background:linear-gradient(90deg,transparent,rgba(245,220,133,.18),transparent) !important;pointer-events:none !important;transform:translateX(-110%);animation:lxhubSweep 4s ease-in-out infinite}
.lxhub .flow-col.out .flow-i::after{animation-delay:2s}
.lxhub .flow-i svg{flex:0 0 auto !important;color:#8DB4FF !important}
.lxhub .flow-col.out .flow-i svg{color:#F5DC85 !important}
.lxhub .hub{position:relative !important;width:220px !important;height:220px !important;margin:0 20px !important;border-radius:50% !important;display:flex !important;flex-direction:column !important;align-items:center !important;justify-content:center !important;text-align:center !important;gap:8px !important;background:radial-gradient(circle at 30% 25%,rgba(47,111,228,.7),rgba(11,31,58,1) 70%) !important;border:2px solid #D4AF37 !important;color:#FFFFFF !important;box-shadow:0 0 0 14px rgba(212,175,55,.08),0 0 0 28px rgba(47,111,228,.06),0 0 60px rgba(91,141,239,.5);animation:lxhubPulse 4s ease-in-out infinite}
.lxhub .hub svg{color:#FFFFFF !important}
.lxhub .hub b{display:block !important;font-family:'Montserrat',sans-serif !important;font-weight:800 !important;font-size:20px !important;color:#FFFFFF !important}
.lxhub .hub span{display:block !important;font-size:12.5px !important;line-height:1.4 !important;color:rgba(255,255,255,.75) !important;max-width:150px !important}
@keyframes lxhubSweep{0%,60%{transform:translateX(-110%)}100%{transform:translateX(300%)}}
@keyframes lxhubPulse{0%,100%{box-shadow:0 0 0 14px rgba(212,175,55,.08),0 0 0 28px rgba(47,111,228,.06),0 0 60px rgba(91,141,239,.5)}50%{box-shadow:0 0 0 18px rgba(212,175,55,.12),0 0 0 36px rgba(47,111,228,.08),0 0 80px rgba(91,141,239,.7)}}
@media (max-width:900px){
  .lxhub .flow{grid-template-columns:1fr !important;gap:36px !important}
  .lxhub .hub{margin:12px auto !important;width:200px !important;height:200px !important}
}
@media (prefers-reduced-motion:reduce){.lxhub .flow-i::after,.lxhub .hub{animation:none !important}.lxhub .flow-i{transition:none !important}}
</style>
