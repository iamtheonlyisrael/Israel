<!-- Luxon graphic | Automated Lead Follow-Up: timeline that lights up step by step | paste into ONE Custom Code element -->
<div class="lxg2">
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&display=swap');
.lxg2,.lxg2 *,.lxg2 *::before,.lxg2 *::after{box-sizing:border-box !important}
.lxg2{width:100% !important;max-width:560px !important;margin:0 auto !important;font-family:'Inter',sans-serif !important}
.lxg2 p{margin:0 !important}
.lxg2 .tl{display:flex !important;flex-direction:column !important;align-items:stretch !important;width:100% !important;text-align:left !important}
.lxg2 .tl-i{position:relative !important;display:flex !important;gap:16px !important;padding-bottom:22px !important;opacity:.35;animation:lxg2Step 10s ease-in-out infinite}
.lxg2 .tl-i:last-child{padding-bottom:0 !important}
.lxg2 .tl-i:not(:last-child)::after{content:'' !important;position:absolute !important;left:9px !important;top:24px !important;bottom:0 !important;width:2px !important;background:linear-gradient(180deg,#D4AF37,rgba(212,175,55,.12)) !important}
.lxg2 .tl-i:nth-child(2){animation-delay:1.6s}
.lxg2 .tl-i:nth-child(3){animation-delay:3.2s}
.lxg2 .tl-i:nth-child(4){animation-delay:4.8s}
.lxg2 .tl-d{flex:0 0 20px !important;width:20px !important;height:20px !important;border-radius:50% !important;margin-top:2px !important;background:#D4AF37 !important;box-shadow:0 0 0 5px rgba(212,175,55,.18) !important}
.lxg2 .tl-d.red{background:#E5484D !important;box-shadow:0 0 0 5px rgba(229,72,77,.15) !important}
.lxg2 .tl-d.green{background:#3DDC97 !important;box-shadow:0 0 0 5px rgba(61,220,151,.18) !important}
.lxg2 .tl-d.blue{background:#5B8DEF !important;box-shadow:0 0 0 5px rgba(91,141,239,.18) !important}
.lxg2 .tl-t{font-weight:600 !important;font-size:15.5px !important;line-height:1.35 !important;color:#1F2933 !important}
.lxg2 .tl-s{font-size:13.5px !important;color:#52606D !important;margin-top:2px !important}
@keyframes lxg2Step{0%,100%{opacity:.35}6%,60%{opacity:1}}
@media (prefers-reduced-motion:reduce){.lxg2 *,.lxg2 *::before,.lxg2 *::after{animation:none !important}.lxg2 .tl-i,.lxg2 .stars svg{opacity:1 !important;transform:none !important}}
</style>
  <div class="tl" role="img" aria-label="Example follow-up: missed call, text sent automatically, quote follow-up email, customer replied and follow-up stops">
    <div class="tl-i"><span class="tl-d red"></span><div><div class="tl-t">Missed call</div><div class="tl-s">Tue · 2:14 PM</div></div></div>
    <div class="tl-i"><span class="tl-d"></span><div><div class="tl-t">Text sent automatically</div><div class="tl-s">Seconds later</div></div></div>
    <div class="tl-i"><span class="tl-d blue"></span><div><div class="tl-t">Quote follow-up email</div><div class="tl-s">Next day</div></div></div>
    <div class="tl-i"><span class="tl-d green"></span><div><div class="tl-t">Customer replied: "Book it!"</div><div class="tl-s">Follow-up stops</div></div></div>
  </div>
</div>
