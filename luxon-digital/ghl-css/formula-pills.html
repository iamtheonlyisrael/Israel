<!-- Luxon graphic | "Transportation know-how + Practical AI + Done-for-you setup + Ongoing support = More bookings, less admin"
     Paste into ONE Custom Code element (full width). Made for a light section. -->
<div class="lxeq-wrap"><div class="lxeq">
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@600&display=swap');
.lxeq,.lxeq *,.lxeq *::before,.lxeq *::after{box-sizing:border-box !important}
/* one line on desktop and tablet: pills, text and gaps shrink with the available width */
.lxeq-wrap{width:100% !important;container-type:inline-size}
.lxeq{width:100% !important;max-width:1200px !important;margin:0 auto !important;display:flex !important;flex-wrap:nowrap !important;align-items:center !important;justify-content:center !important;gap:clamp(5px,1.1cqw,16px) !important;font-family:'Inter',sans-serif !important}
.lxeq .p{display:inline-flex !important;align-items:center !important;height:clamp(40px,4.4cqw,50px) !important;padding:0 clamp(10px,1.7cqw,22px) !important;flex:none !important;border-radius:12px !important;background:linear-gradient(135deg,#163A7A,#0B1F3A) !important;border:1px solid rgba(141,180,255,.25) !important;color:#FFFFFF !important;font-weight:600 !important;font-size:clamp(11.5px,1.3cqw,15px) !important;white-space:nowrap !important;box-shadow:0 10px 24px rgba(11,31,58,.18) !important;transition:transform .3s ease,box-shadow .3s ease}
.lxeq .p:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(11,31,58,.26) !important}
.lxeq .op{font-family:'Montserrat',sans-serif !important;flex:none !important;font-weight:800 !important;font-size:clamp(16px,1.9cqw,22px) !important;color:#D4AF37 !important;line-height:1 !important}
.lxeq .p.res{background:linear-gradient(135deg,#B8932A,#F5DC85) !important;border:0 !important;color:#0B1F3A !important;font-family:'Montserrat',sans-serif !important;font-weight:700 !important;box-shadow:0 12px 28px rgba(212,175,55,.35) !important;animation:lxeqGlow 3.2s ease-in-out infinite}
@keyframes lxeqGlow{0%,100%{box-shadow:0 12px 28px rgba(212,175,55,.3)}50%{box-shadow:0 12px 34px rgba(212,175,55,.6)}}
/* phones: stack vertically */
@container (max-width:780px){.lxeq{flex-direction:column !important;gap:8px !important}.lxeq .p{height:46px !important;padding:0 22px !important;font-size:14.5px !important}.lxeq .op{font-size:20px !important}}
@media (prefers-reduced-motion:reduce){.lxeq .p{animation:none !important;transition:none !important}}
</style>
  <span class="p">Transportation know-how</span><span class="op">+</span>
  <span class="p">Practical AI</span><span class="op">+</span>
  <span class="p">Done-for-you setup</span><span class="op">+</span>
  <span class="p">Ongoing support</span><span class="op">=</span>
  <span class="p res">More bookings, less admin</span>
</div>
</div>
