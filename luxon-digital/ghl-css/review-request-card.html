<!-- Luxon graphic | Review requests: "Ride completed" card with a review text, stars filling in, then two outcome cards
     Paste into ONE Custom Code element. Made for a dark navy section. -->
<div class="lxrv">
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&display=swap');
.lxrv,.lxrv *,.lxrv *::before,.lxrv *::after{box-sizing:border-box !important}
.lxrv{width:100% !important;max-width:560px !important;margin:0 auto !important;font-family:'Inter',sans-serif !important;text-align:left !important}
.lxrv .card{padding:26px 28px 24px !important;border-radius:24px !important;background:#FFFFFF !important;color:#1F2933 !important;box-shadow:0 40px 90px rgba(0,0,0,.35) !important}
.lxrv .head{display:flex !important;align-items:center !important;justify-content:space-between !important;gap:12px !important;padding-bottom:16px !important;margin-bottom:16px !important;border-bottom:1px solid #E4E7EB !important}
.lxrv .who{display:flex !important;align-items:center !important;gap:10px !important;font-family:'Montserrat',sans-serif !important;font-weight:700 !important;font-size:15px !important;color:#0B1F3A !important}
.lxrv .dot{flex:none !important;width:20px !important;height:20px !important;border-radius:50% !important;background:#3DDC97 !important;box-shadow:0 0 0 4px rgba(61,220,151,.22);animation:lxrvDot 2s ease-in-out infinite}
.lxrv .chip{padding:5px 14px !important;border-radius:999px !important;font-size:12.5px !important;font-weight:600 !important;white-space:nowrap !important;background:#EEF4FF !important;color:#2F6FE4 !important;border:1px solid rgba(47,111,228,.25) !important}
.lxrv .msg{display:inline-block !important;max-width:88% !important;padding:12px 14px !important;border-radius:14px 14px 14px 4px !important;background:#0B1F3A !important;color:#FFFFFF !important;font-size:14.5px !important;line-height:1.5 !important;animation:lxrvMsg 8s ease-out infinite}
.lxrv .stars{display:flex !important;justify-content:center !important;gap:12px !important;margin:18px 0 12px !important}
.lxrv .stars svg{width:32px !important;height:32px !important;fill:#E4E7EB;animation:lxrvStar 8s ease-out infinite}
.lxrv .stars svg:nth-child(2){animation-delay:.15s}
.lxrv .stars svg:nth-child(3){animation-delay:.3s}
.lxrv .stars svg:nth-child(4){animation-delay:.45s}
.lxrv .stars svg:nth-child(5){animation-delay:.6s}
.lxrv .link{display:block !important;text-align:center !important;font-weight:600 !important;font-size:15.5px !important;color:#2F6FE4 !important;animation:lxrvLink 8s ease-out infinite}
.lxrv .note{display:block !important;text-align:right !important;margin-top:10px !important;font-size:11px !important;color:#9AA5B1 !important}
.lxrv .outs{display:grid !important;grid-template-columns:1fr 1fr !important;gap:20px !important;margin-top:18px !important}
.lxrv .out{padding:30px 28px !important;border-radius:20px !important;background:rgba(255,255,255,.05) !important;border:1px solid rgba(141,180,255,.22) !important;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.lxrv .pill{display:inline-block !important;padding:6px 14px !important;border-radius:999px !important;font-family:'Montserrat',sans-serif !important;font-weight:700 !important;font-size:12.5px !important;letter-spacing:.04em !important;text-transform:uppercase !important;color:#FFFFFF !important;background:rgba(91,141,239,.18) !important;border:1px solid rgba(141,180,255,.4) !important;margin-bottom:16px !important}
.lxrv .out p{margin:0 !important;font-size:15.5px !important;line-height:1.6 !important;color:rgba(255,255,255,.75) !important}
@keyframes lxrvDot{0%,100%{box-shadow:0 0 0 4px rgba(61,220,151,.22)}50%{box-shadow:0 0 0 8px rgba(61,220,151,.08)}}
@keyframes lxrvMsg{0%{opacity:0;transform:translateY(8px)}6%,100%{opacity:1;transform:none}}
@keyframes lxrvStar{0%,12%{fill:#E4E7EB;transform:scale(1)}17%{fill:#D4AF37;transform:scale(1.2)}21%,92%{fill:#D4AF37;transform:scale(1)}100%{fill:#E4E7EB}}
@keyframes lxrvLink{0%,22%{opacity:.35}28%,92%{opacity:1}100%{opacity:.35}}
@media (max-width:560px){
  .lxrv .card{padding:22px 18px 20px !important}
  .lxrv .head{flex-wrap:wrap !important}
  .lxrv .msg{max-width:100% !important}
  .lxrv .stars svg{width:28px !important;height:28px !important}
  .lxrv .outs{grid-template-columns:1fr !important;gap:14px !important}
  .lxrv .out{padding:24px 22px !important}
}
@media (prefers-reduced-motion:reduce){.lxrv .dot,.lxrv .msg,.lxrv .link{animation:none !important}.lxrv .stars svg{animation:none !important;fill:#D4AF37}}
</style>
  <div class="card">
    <div class="head">
      <div class="who"><span class="dot"></span>Ride completed · 9:12 PM</div>
      <span class="chip">Review request</span>
    </div>
    <div class="msg">Thanks for riding with [Your Limo Co.], James! How was your trip tonight?</div>
    <div class="stars" aria-label="5 stars">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
    </div>
    <span class="link">Share it on Google →</span>
    <span class="note">Sample message</span>
  </div>
  <div class="outs">
    <div class="out"><span class="pill">Happy rider</span><p>Sent to your Google review page.</p></div>
    <div class="out"><span class="pill">Concern</span><p>You’re alerted to make it right.</p></div>
  </div>
</div>
