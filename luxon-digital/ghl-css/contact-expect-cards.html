<!-- ================= CONTACT / BOOKING: "WHAT TO EXPECT" + "PREFER TO REACH OUT?" CARDS =================
     Paste into a GHL Custom Code (HTML) element in the right-hand column.
     Business phone and email are linked (tap to call / tap to email). -->
<div class="lxexp">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&display=swap');
    .lxexp{--navy:#0B1F3A;--gold:#D4AF37;--blue:#1E4FA8;--char:#1F2933;
      width:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:18px;
      font-family:'Inter',system-ui,sans-serif;box-sizing:border-box}
    .lxexp *{box-sizing:border-box;margin:0;padding:0}
    .lxexp-card{position:relative;border-radius:20px;padding:28px 30px;
      transition:transform .3s ease,box-shadow .3s ease}
    .lxexp-card:hover{transform:translateY(-4px)}
    /* light card with blue→gold gradient border */
    .lxexp-light{background:linear-gradient(#fff,#fff) padding-box,
      linear-gradient(135deg,rgba(30,79,168,.35),rgba(212,175,55,.55)) border-box;
      border:1.5px solid transparent;box-shadow:0 10px 30px rgba(11,31,58,.08)}
    .lxexp-light:hover{box-shadow:0 18px 40px rgba(11,31,58,.14)}
    /* navy card */
    .lxexp-dark{background:radial-gradient(120% 90% at 100% 0%,rgba(212,175,55,.16),transparent 55%),
      linear-gradient(150deg,#0F2A4F 0%,#0B1F3A 60%,#081629 100%);
      border:1px solid rgba(212,175,55,.35);box-shadow:0 14px 36px rgba(11,31,58,.28)}
    .lxexp-dark:hover{box-shadow:0 22px 46px rgba(11,31,58,.38)}
    .lxexp-title{font-family:'Montserrat',sans-serif;font-weight:800;font-size:20px;line-height:1.3;
      color:var(--navy);margin-bottom:18px}
    .lxexp-dark .lxexp-title{color:#fff}
    .lxexp-list{list-style:none;display:flex;flex-direction:column;gap:14px}
    .lxexp-list li{display:flex;align-items:center;gap:12px;font-size:16px;line-height:1.45;
      font-weight:500;color:var(--char)}
    .lxexp-dark .lxexp-list li{color:rgba(255,255,255,.9)}
    .lxexp-ic{flex:0 0 26px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
      background:var(--blue);box-shadow:0 4px 10px rgba(30,79,168,.3)}
    .lxexp-dark .lxexp-ic{background:linear-gradient(135deg,#F0D27A,#D4AF37 55%,#B8932A);
      box-shadow:0 4px 12px rgba(212,175,55,.35)}
    .lxexp-ic svg{width:14px;height:14px}
    .lxexp-dark .lxexp-list a{color:inherit;text-decoration:none;overflow-wrap:anywhere}
    .lxexp-dark .lxexp-list a:hover{color:var(--gold)}
    @media (max-width:480px){
      .lxexp-card{padding:22px 20px;border-radius:18px}
      .lxexp-title{font-size:18px;margin-bottom:14px}
      .lxexp-list li{font-size:15px}
    }
    @media (prefers-reduced-motion:reduce){.lxexp-card{transition:none}.lxexp-card:hover{transform:none}}
  </style>

  <div class="lxexp-card lxexp-light">
    <h3 class="lxexp-title">What to expect</h3>
    <ul class="lxexp-list">
      <li><span class="lxexp-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>A friendly, no-pressure call</li>
      <li><span class="lxexp-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Hear the AI receptionist live</li>
      <li><span class="lxexp-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>A setup recommendation for your fleet</li>
    </ul>
  </div>

  <div class="lxexp-card lxexp-dark">
    <h3 class="lxexp-title">Prefer to reach out?</h3>
    <ul class="lxexp-list">
      <li><span class="lxexp-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#0B1F3A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><a href="tel:+12067478732">+1 206-747-8732</a></li>
      <li><span class="lxexp-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#0B1F3A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><a href="mailto:abdurhamanshifa@gmail.com">abdurhamanshifa@gmail.com</a></li>
      <li><span class="lxexp-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#0B1F3A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Mon–Fri</li>
    </ul>
  </div>
</div>
