<!-- Luxon eyebrow pill: paste into a Custom Code element and change the text -->
<div class="lx-eyebrow-wrap">
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap');
.lx-eyebrow-wrap{display:flex;justify-content:flex-start}
.lx-eyebrow{position:relative;display:inline-flex;align-items:center;gap:10px;max-width:100%;padding:8px 18px 8px 14px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(212,175,55,.5);overflow:hidden;box-sizing:border-box;font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;line-height:1.35;letter-spacing:.16em;text-transform:uppercase;color:#F5DC85;animation:lxEyeIn .8s ease both,lxEyeGlow 4s ease-in-out 1s infinite}
.lx-eyebrow::before{content:'';flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:#3DDC97;animation:lxEyePing 2s ease-out infinite}
.lx-eyebrow::after{content:'';position:absolute;top:0;bottom:0;left:0;width:35%;background:linear-gradient(100deg,transparent,rgba(245,220,133,.28),transparent);pointer-events:none;transform:translateX(-120%);animation:lxEyeSweep 5s ease-in-out 1.2s infinite}
@keyframes lxEyeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes lxEyeGlow{0%,100%{box-shadow:0 0 0 0 rgba(212,175,55,0)}50%{box-shadow:0 0 18px 0 rgba(212,175,55,.28)}}
@keyframes lxEyePing{0%{box-shadow:0 0 0 0 rgba(61,220,151,.7)}100%{box-shadow:0 0 0 9px rgba(61,220,151,0)}}
@keyframes lxEyeSweep{0%,55%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
@media (max-width:480px){.lx-eyebrow{font-size:10.5px;letter-spacing:.12em}}
@media (prefers-reduced-motion:reduce){.lx-eyebrow,.lx-eyebrow::before,.lx-eyebrow::after{animation:none}}
</style>
<span class="lx-eyebrow">Luxon Limo AI · For transportation companies</span>
</div>
