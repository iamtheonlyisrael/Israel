<!-- Luxon Lead Follow-Up page | "How it works" 4 steps with a light running along the line | paste into ONE Custom Code element (full width).
     Made for a dark navy section. -->
<div class="lxsteps">
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Inter:wght@400;500&display=swap');
.lxsteps,.lxsteps *,.lxsteps *::before,.lxsteps *::after{box-sizing:border-box !important}
.lxsteps{width:100% !important;max-width:1200px !important;margin:0 auto !important;font-family:'Inter',sans-serif !important;text-align:center !important}
.lxsteps .steps{position:relative !important;display:grid !important;grid-template-columns:repeat(4,minmax(0,1fr)) !important;gap:20px !important}
/* connecting line between the circles, with a light running along it */
.lxsteps .track{position:absolute !important;left:12.5% !important;right:12.5% !important;top:34px !important;height:2px !important;background:rgba(141,180,255,.2) !important;overflow:hidden !important;z-index:0 !important}
.lxsteps .track i{position:absolute !important;top:0 !important;left:-10%;width:20% !important;height:100% !important;background:linear-gradient(90deg,transparent,#F5DC85,#8DB4FF,transparent) !important;animation:lxstepsRun 4s linear infinite}
.lxsteps .st{position:relative !important;z-index:1 !important;padding:0 6px !important}
.lxsteps .ring{position:relative !important;width:70px !important;height:70px !important;margin:0 auto 20px !important;border-radius:50% !important;padding:2px !important;background:linear-gradient(135deg,#F5DC85,#D4AF37 40%,#5B8DEF) !important;box-shadow:0 0 30px rgba(91,141,239,.3);animation:lxstepsPulse 4s ease-out infinite}
/* each circle lights up the moment the running light reaches it */
.lxsteps .st:nth-child(3) .ring{animation-delay:1s}
.lxsteps .st:nth-child(4) .ring{animation-delay:2s}
.lxsteps .st:nth-child(5) .ring{animation-delay:3s}
.lxsteps .ring span{width:100% !important;height:100% !important;border-radius:50% !important;background:#0B1F3A !important;display:flex !important;align-items:center !important;justify-content:center !important;color:#F5DC85 !important}
.lxsteps .h3{font-family:'Montserrat',sans-serif !important;font-weight:700 !important;font-size:20px !important;line-height:1.3 !important;color:#FFFFFF !important;margin:0 0 8px !important}
.lxsteps .txt{font-size:15.5px !important;line-height:1.65 !important;color:rgba(255,255,255,.75) !important;margin:0 auto !important;max-width:280px !important}
@keyframes lxstepsRun{0%{left:-10%;opacity:1}75%{left:90%;opacity:1}85%,100%{left:90%;opacity:0}}
@keyframes lxstepsPulse{0%,25%,100%{box-shadow:0 0 30px rgba(91,141,239,.3);transform:scale(1)}6%{box-shadow:0 0 0 8px rgba(212,175,55,.25),0 0 40px rgba(245,220,133,.7);transform:scale(1.06)}}
/* tablets: 2 x 2, phones: one column (the line is hidden) */
@media (max-width:900px){.lxsteps .steps{grid-template-columns:1fr 1fr !important;gap:36px 18px !important}.lxsteps .track{display:none !important}}
@media (max-width:560px){.lxsteps .steps{grid-template-columns:1fr !important}}
@media (prefers-reduced-motion:reduce){.lxsteps .ring,.lxsteps .track i{animation:none !important}}
</style>
  <div class="steps">
    <span class="track" aria-hidden="true"><i></i></span>
    <div class="st"><div class="ring"><span><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></span></div><h3 class="h3">Missed-call text-back</h3><p class="txt">A friendly text goes out right after a missed call.</p></div>
    <div class="st"><div class="ring"><span><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/></svg></span></div><h3 class="h3">Quote follow-up</h3><p class="txt">Timed check-ins by text and email that feel helpful, not pushy.</p></div>
    <div class="st"><div class="ring"><span><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span></div><h3 class="h3">Stops automatically</h3><p class="txt">When they reply, book, opt out or need a person.</p></div>
    <div class="st"><div class="ring"><span><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></span></div><h3 class="h3">Your team is notified</h3><p class="txt">The moment an interested lead responds.</p></div>
  </div>
</div>
