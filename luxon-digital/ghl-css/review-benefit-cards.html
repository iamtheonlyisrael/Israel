<!-- Luxon graphic | Review Automation: 3 benefit cards (After every ride / Protects your reputation / Builds trust)
     Paste into ONE Custom Code element (full width). Made for a light section. -->
<div class="lxben">
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Inter:wght@400;500&display=swap');
.lxben,.lxben *,.lxben *::before,.lxben *::after{box-sizing:border-box !important}
.lxben{width:100% !important;max-width:1200px !important;margin:0 auto !important;font-family:'Inter',sans-serif !important;text-align:left !important;display:grid !important;grid-template-columns:repeat(3,minmax(0,1fr)) !important;gap:22px !important}
/* white card with a soft blue -> gold border */
.lxben .bc{padding:30px 30px 32px !important;border-radius:22px !important;border:1px solid transparent !important;background:linear-gradient(#FFFFFF,#FFFFFF) padding-box,linear-gradient(135deg,rgba(91,141,239,.45),rgba(212,175,55,.5)) border-box !important;box-shadow:0 18px 40px rgba(11,31,58,.07) !important;transition:transform .35s ease,box-shadow .35s ease}
.lxben .bc:hover{transform:translateY(-6px);box-shadow:0 26px 54px rgba(11,31,58,.13) !important}
.lxben .ic{width:54px !important;height:54px !important;border-radius:14px !important;display:flex !important;align-items:center !important;justify-content:center !important;margin-bottom:24px !important;background:linear-gradient(135deg,#0B1F3A,#1E4FA8) !important;color:#F5DC85 !important;box-shadow:0 10px 24px rgba(30,79,168,.35) !important;transition:transform .35s ease}
.lxben .ic.gold{background:linear-gradient(135deg,#B8932A,#F5DC85) !important;color:#0B1F3A !important;box-shadow:0 10px 24px rgba(212,175,55,.35) !important}
.lxben .bc:hover .ic{transform:scale(1.08) rotate(-4deg)}
.lxben .h3{font-family:'Montserrat',sans-serif !important;font-weight:700 !important;font-size:20px !important;line-height:1.3 !important;color:#0B1F3A !important;margin:0 0 10px !important}
.lxben .txt{margin:0 !important;font-size:15px !important;line-height:1.7 !important;color:#3E4C59 !important}
@media (max-width:900px){.lxben{grid-template-columns:1fr !important;max-width:560px !important;gap:16px !important}}
@media (max-width:560px){.lxben .bc{padding:24px 22px 26px !important}}
@media (prefers-reduced-motion:reduce){.lxben .bc,.lxben .ic{transition:none !important}}
</style>
  <div class="bc">
    <div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 16V11l2-4.5a2 2 0 0 1 1.8-1.2h6.4A2 2 0 0 1 17 6.5L19 11v5"/><path d="M3 16h18v1.5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><circle cx="7.5" cy="13.5" r=".6"/><circle cx="16.5" cy="13.5" r=".6"/></svg></div>
    <h3 class="h3">After every ride</h3>
    <p class="txt">Requests go out on time, every time. No one has to remember.</p>
  </div>
  <div class="bc">
    <div class="ic gold"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg></div>
    <h3 class="h3">Protects your reputation</h3>
    <p class="txt">Negative feedback alerts a person instead of pushing for a public review.</p>
  </div>
  <div class="bc">
    <div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg></div>
    <h3 class="h3">Builds trust for new riders</h3>
    <p class="txt">Recent reviews help new customers choose you with confidence.</p>
  </div>
</div>
