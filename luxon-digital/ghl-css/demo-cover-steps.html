<!-- Luxon Demo page | "What we'll cover together" 3 steps with a light running along the line | paste into ONE Custom Code element (full width).
     Made for a dark navy section. -->
<div class="lxcov">
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Inter:wght@400;500&display=swap');
.lxcov,.lxcov *,.lxcov *::before,.lxcov *::after{box-sizing:border-box !important}
.lxcov{width:100% !important;max-width:1200px !important;margin:0 auto !important;font-family:'Inter',sans-serif !important;text-align:center !important}
.lxcov .steps{position:relative !important;display:grid !important;grid-template-columns:repeat(3,minmax(0,1fr)) !important;gap:24px !important}
/* connecting line (runs a little past the first and last circle) with a light running along it */
.lxcov .track{position:absolute !important;left:10% !important;right:10% !important;top:34px !important;height:2px !important;background:linear-gradient(90deg,rgba(141,180,255,0),rgba(141,180,255,.25) 12%,rgba(141,180,255,.25) 88%,rgba(141,180,255,0)) !important;overflow:hidden !important;z-index:0 !important}
.lxcov .track i{position:absolute !important;top:0 !important;left:-1.7%;width:20% !important;height:100% !important;background:linear-gradient(90deg,transparent,#F5DC85,#8DB4FF,transparent) !important;animation:lxcovRun 3s linear infinite}
.lxcov .st{position:relative !important;z-index:1 !important;padding:0 10px !important}
.lxcov .ring{position:relative !important;width:70px !important;height:70px !important;margin:0 auto 20px !important;border-radius:50% !important;padding:2px !important;background:linear-gradient(135deg,#F5DC85,#D4AF37 40%,#8DB4FF) !important;box-shadow:0 0 30px rgba(91,141,239,.3);animation:lxcovPulse 3s ease-out infinite}
/* each circle lights up the moment the running light reaches it */
.lxcov .st:nth-child(3) .ring{animation-delay:1s}
.lxcov .st:nth-child(4) .ring{animation-delay:2s}
.lxcov .ring span{width:100% !important;height:100% !important;border-radius:50% !important;background:#0B1F3A !important;display:flex !important;align-items:center !important;justify-content:center !important;color:#F5DC85 !important}
.lxcov .h3{font-family:'Montserrat',sans-serif !important;font-weight:700 !important;font-size:20px !important;line-height:1.3 !important;color:#FFFFFF !important;margin:0 0 8px !important}
.lxcov .txt{font-size:15.5px !important;line-height:1.65 !important;color:rgba(255,255,255,.78) !important;margin:0 auto !important;max-width:340px !important}
@keyframes lxcovRun{0%{left:-1.7%;opacity:1}66.7%{left:81.7%;opacity:1}80%,100%{left:81.7%;opacity:0}}
@keyframes lxcovPulse{0%,30%,100%{box-shadow:0 0 30px rgba(91,141,239,.3);transform:scale(1)}8%{box-shadow:0 0 0 8px rgba(212,175,55,.25),0 0 40px rgba(245,220,133,.7);transform:scale(1.06)}}
/* tablets & phones: one column, the line is hidden */
@media (max-width:800px){.lxcov .steps{grid-template-columns:1fr !important;gap:36px !important}.lxcov .track{display:none !important}}
@media (prefers-reduced-motion:reduce){.lxcov .ring,.lxcov .track i{animation:none !important}}
</style>
