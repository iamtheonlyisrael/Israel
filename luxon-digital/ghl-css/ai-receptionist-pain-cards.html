<!-- Luxon AI Receptionist page | "Sound familiar?" 3 pain-point cards | paste into ONE Custom Code element (full width).
     Transparent background, so it sits on the section's light gradient. -->
<div class="lxpain">
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Inter:wght@400;500&display=swap');
.lxpain,.lxpain *,.lxpain *::before,.lxpain *::after{box-sizing:border-box !important}
.lxpain{width:100% !important;max-width:1200px !important;margin:0 auto !important;font-family:'Inter',sans-serif !important}
.lxpain .grid{display:grid !important;grid-template-columns:repeat(3,minmax(0,1fr)) !important;gap:20px !important}
.lxpain .card{position:relative !important;display:block !important;padding:30px !important;border-radius:22px !important;color:#1F2933 !important;background:linear-gradient(#FFFFFF,#FFFFFF) padding-box,linear-gradient(135deg,rgba(47,111,228,.35),rgba(228,231,235,1) 40%,rgba(212,175,55,.45)) border-box !important;border:1.5px solid transparent !important;box-shadow:0 16px 40px rgba(11,31,58,.06) !important;transition:transform .3s ease,box-shadow .3s ease !important}
.lxpain.js .card{opacity:0;transform:translateY(18px)}
.lxpain.in .card{animation:lxpainIn .7s cubic-bezier(.2,.8,.2,1) forwards}
.lxpain.in .card:nth-child(2){animation-delay:.1s}
.lxpain.in .card:nth-child(3){animation-delay:.2s}
.lxpain .card:hover{transform:translateY(-6px) !important;box-shadow:0 28px 60px rgba(11,31,58,.13) !important}
.lxpain .ico{display:flex !important;align-items:center !important;justify-content:center !important;width:54px !important;height:54px !important;border-radius:15px !important;margin-bottom:18px !important;color:#F5DC85 !important;background:linear-gradient(135deg,#0B1F3A,#1E4FA8) !important;box-shadow:0 12px 26px rgba(30,79,168,.3) !important;transition:transform .3s ease !important}
.lxpain .ico.gold{background:linear-gradient(135deg,#B8922A,#F5DC85) !important;color:#0B1F3A !important;box-shadow:0 12px 26px rgba(212,175,55,.35) !important}
.lxpain .card:hover .ico{transform:scale(1.08) rotate(-4deg) !important}
.lxpain .h3{font-family:'Montserrat',sans-serif !important;font-weight:700 !important;font-size:20px !important;line-height:1.3 !important;color:#0B1F3A !important;margin:0 0 8px !important}
.lxpain .txt{font-size:15.5px !important;line-height:1.65 !important;color:#3E4C59 !important;margin:0 !important}
@keyframes lxpainIn{to{opacity:1;transform:none}}
@media (max-width:900px){.lxpain .grid{grid-template-columns:1fr !important;gap:14px !important}.lxpain .card{padding:24px !important}}
@media (prefers-reduced-motion:reduce){.lxpain .card{opacity:1 !important;transform:none !important;animation:none !important;transition:none !important}.lxpain .ico{transition:none !important}}
</style>
  <div class="grid">
    <div class="card"><span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17h14M3 13l2-6h14l2 6v4H3z"/><circle cx="7.5" cy="17" r="1.5"/><circle cx="16.5" cy="17" r="1.5"/></svg></span><h3 class="h3">You’re behind the wheel</h3><p class="txt">You can’t safely pick up, and the caller won’t wait.</p></div>
    <div class="card"><span class="ico gold"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span><h3 class="h3">It’s after hours</h3><p class="txt">Late-night travelers book whoever answers first.</p></div>
    <div class="card"><span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/></svg></span><h3 class="h3">The same questions, all day</h3><p class="txt">Service areas, vehicle types, waiting time. Again and again.</p></div>
  </div>
<script>
(function () {
  /* cards fade up when scrolled into view (they stay visible in the editor, where scripts don't run) */
  var els = document.querySelectorAll('.lxpain:not(.in)');
  for (var k = 0; k < els.length; k++) els[k].classList.add('js');
  if (!('IntersectionObserver' in window)) { for (var i = 0; i < els.length; i++) els[i].classList.add('in'); return; }
  var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }); }, { threshold: .15 });
  for (var j = 0; j < els.length; j++) io.observe(els[j]);
})();
</script>
</div>
