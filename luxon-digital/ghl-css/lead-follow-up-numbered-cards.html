<!-- Luxon Lead Follow-Up page | "Most lost bookings" 3 numbered cards | paste into ONE Custom Code element (full width).
     Transparent background, so it sits on the section's light gradient. -->
<div class="lxlost">
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500&display=swap');
.lxlost,.lxlost *,.lxlost *::before,.lxlost *::after{box-sizing:border-box !important}
.lxlost{width:100% !important;max-width:1200px !important;margin:0 auto !important;font-family:'Inter',sans-serif !important}
.lxlost .grid{display:grid !important;grid-template-columns:repeat(3,minmax(0,1fr)) !important;gap:20px !important}
.lxlost .card{position:relative !important;display:block !important;padding:30px !important;border-radius:22px !important;color:#1F2933 !important;background:linear-gradient(#FFFFFF,#FFFFFF) padding-box,linear-gradient(135deg,rgba(47,111,228,.35),rgba(228,231,235,1) 40%,rgba(212,175,55,.45)) border-box !important;border:1.5px solid transparent !important;box-shadow:0 16px 40px rgba(11,31,58,.06) !important;transition:transform .3s ease,box-shadow .3s ease !important}
.lxlost.js .card{opacity:0;transform:translateY(18px)}
.lxlost.in .card{animation:lxlostIn .7s cubic-bezier(.2,.8,.2,1) forwards}
.lxlost.in .card:nth-child(2){animation-delay:.1s}
.lxlost.in .card:nth-child(3){animation-delay:.2s}
.lxlost .card:hover{transform:translateY(-6px) !important;box-shadow:0 28px 60px rgba(11,31,58,.13) !important}
.lxlost .num{display:inline-block !important;margin:0 0 16px !important;font-family:'Montserrat',sans-serif !important;font-weight:800 !important;font-size:38px !important;line-height:1 !important;background:linear-gradient(135deg,#B8922A,#F5DC85) !important;-webkit-background-clip:text !important;background-clip:text !important;color:transparent !important;-webkit-text-fill-color:transparent !important;transition:transform .3s ease !important}
.lxlost .card:hover .num{transform:translateY(-2px) scale(1.06) !important}
.lxlost .h3{font-family:'Montserrat',sans-serif !important;font-weight:700 !important;font-size:20px !important;line-height:1.3 !important;color:#0B1F3A !important;margin:0 0 8px !important}
.lxlost .txt{font-size:15.5px !important;line-height:1.65 !important;color:#3E4C59 !important;margin:0 !important}
@keyframes lxlostIn{to{opacity:1;transform:none}}
@media (max-width:900px){.lxlost .grid{grid-template-columns:1fr !important;gap:14px !important}.lxlost .card{padding:24px !important}}
@media (prefers-reduced-motion:reduce){.lxlost .card{opacity:1 !important;transform:none !important;animation:none !important;transition:none !important}.lxlost .num{transition:none !important}}
</style>
  <div class="grid">
    <div class="card"><span class="num">01</span><h3 class="h3">Slow first response</h3><p class="txt">By the time you call back, they’ve booked elsewhere.</p></div>
    <div class="card"><span class="num">02</span><h3 class="h3">Quotes that go quiet</h3><p class="txt">A quote goes out, and no one checks in again.</p></div>
    <div class="card"><span class="num">03</span><h3 class="h3">No time to chase</h3><p class="txt">You’re busy running rides, not sending reminders.</p></div>
  </div>
<script>
(function () {
  /* cards fade up when scrolled into view (they stay visible in the editor, where scripts don't run) */
  var els = document.querySelectorAll('.lxlost:not(.in)');
  for (var k = 0; k < els.length; k++) els[k].classList.add('js');
  if (!('IntersectionObserver' in window)) { for (var i = 0; i < els.length; i++) els[i].classList.add('in'); return; }
  var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }); }, { threshold: .15 });
  for (var j = 0; j < els.length; j++) io.observe(els[j]);
})();
</script>
</div>
