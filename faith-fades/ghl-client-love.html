<div id="faith-fades-reviews">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap");

    #faith-fades-reviews {
      --aqua: #81d8d0;
      --gold: #c9a96e;
      --black: #252525;
      --white: #ffffff;

      width: 100%;
      overflow: hidden;
      color: var(--white);
      background: var(--black);
      font-family: "Poppins", sans-serif;
      line-height: 1.5;
    }

    #faith-fades-reviews *,
    #faith-fades-reviews *::before,
    #faith-fades-reviews *::after {
      box-sizing: border-box;
    }

    #faith-fades-reviews a {
      color: inherit;
      text-decoration: none;
    }

    #faith-fades-reviews .ffr-section {
      padding: 80px 0;
    }

    #faith-fades-reviews .ffr-shell {
      width: min(1160px, calc(100% - 32px));
      margin: 0 auto;
    }

    #faith-fades-reviews .ffr-head {
      margin: 0 0 44px;
      text-align: center;
    }

    #faith-fades-reviews .ffr-eyebrow {
      margin: 0 0 14px;
      color: var(--gold);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    #faith-fades-reviews .ffr-heading {
      margin: 0;
      font-size: clamp(28px, 5vw, 46px);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.05;
    }

    #faith-fades-reviews .ffr-heading em {
      color: var(--aqua);
      font-style: italic;
      font-weight: 500;
    }

    #faith-fades-reviews .ffr-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    #faith-fades-reviews .ffr-card {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 26px 24px;
      border: 1px solid rgba(201, 169, 110, 0.3);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      transition: transform 0.25s ease, border-color 0.25s ease;
    }

    #faith-fades-reviews .ffr-card:hover {
      transform: translateY(-4px);
      border-color: var(--aqua);
    }

    #faith-fades-reviews .ffr-stars {
      color: var(--gold);
      font-size: 14px;
      letter-spacing: 3px;
    }

    #faith-fades-reviews .ffr-quote {
      flex: 1;
      margin: 0;
      color: rgba(255, 255, 255, 0.86);
      font-size: 15px;
      font-style: italic;
      font-weight: 500;
      line-height: 1.7;
    }

    #faith-fades-reviews .ffr-author {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
    }

    #faith-fades-reviews .ffr-author svg {
      width: 16px;
      height: 16px;
      color: var(--aqua);
      flex-shrink: 0;
    }

    #faith-fades-reviews .ffr-cta {
      display: flex;
      justify-content: center;
      margin-top: 36px;
    }

    #faith-fades-reviews .ffr-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 24px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
      transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }

    #faith-fades-reviews .ffr-button:hover {
      border-color: var(--aqua);
      background: var(--aqua);
      color: var(--black);
    }

    @media (max-width: 900px) {
      #faith-fades-reviews .ffr-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      #faith-fades-reviews .ffr-section {
        padding: 56px 0;
      }

      #faith-fades-reviews .ffr-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <section class="ffr-section" id="reviews">

        <p class="ffr-eyebrow">Straight From The Comments</p>

          <p class="ffr-quote">"PASTE COMMENT 3 HERE"</p>
          <div class="ffr-author">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/></svg>

      <div class="ffr-cta">

    </div>
  </section>
</div>
